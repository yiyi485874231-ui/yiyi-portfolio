name: Register self-hosted Sanity Studio

on:
  push:
    branches:
      - main
    paths:
      - "studio/**"
      - ".github/workflows/register-external-studio.yml"
  workflow_dispatch:

jobs:
  register:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Studio dependencies
        run: npm install
      - name: Register external Studio and deploy schema
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_AUTH_TOKEN }}
        run: npx sanity@latest deploy --external --url https://yiyi-portfolio-editor.onrender.com --schema-required --yes
