media:
  input: public/uploads
  output: /uploads
  rename: safe

content:
  - name: works
    label: 作品管理
    type: collection
    path: content/works
    format: json
    filename: "{primary}.json"
    exclude:
      - .gitkeep
    view:
      primary: title
      fields:
        - title
        - category
        - type
        - sortOrder
      sort: [sortOrder, title]
      default:
        sort: sortOrder
        order: asc
    fields:
      - name: id
        label: 作品 ID
        type: string
        required: true
      - name: title
        label: 作品名称
        type: string
        required: true
      - name: category
        label: 所属分类
        type: select
        options:
          values:
            - label: 内容运营与策划
              value: 运营
            - label: 视频与 AI 创作
              value: 视频
            - label: 视觉设计作品
              value: 视觉
            - label: 其他作品
              value: 其他
      - name: type
        label: 作品类型
        type: string
      - name: desc
        label: 作品简介
        type: text
      - name: role
        label: 个人职责
        type: text
      - name: result
        label: 项目成果
        type: text
      - name: tags
        label: 作品标签
        type: string
        list: true
      - name: detail
        label: 详细说明
        type: text
        list: true
      - name: tone
        label: 卡片底色
        type: select
        options:
          values:
            - peach
            - lavender
            - sage
            - sand
            - rose
      - name: coverImage
        label: 封面图片
        type: image
        options:
          path: public/uploads/covers
      - name: gallery
        label: 作品图片 / 视觉展示
        type: image
        options:
          multiple:
            max: 30
          path: public/uploads/gallery
      - name: coverFit
        label: 封面图片显示
        type: select
        options:
          values:
            - label: 完整显示（不裁切）
              value: contain
            - label: 填充区域（允许裁切）
              value: cover
      - name: coverRatio
        label: 封面图片比例
        type: select
        options:
          values:
            - label: 横版 16:7
              value: wide
            - label: 横版 4:3
              value: landscape
            - label: 正方形 1:1
              value: square
            - label: 竖版 3:4
              value: portrait
      - name: galleryColumns
        label: 作品图片每行数量
        type: select
        options:
          values:
            - label: 单列（大图）
              value: "1"
            - label: 双列
              value: "2"
            - label: 三列
              value: "3"
      - name: galleryRatio
        label: 作品图片比例
        type: select
        options:
          values:
            - label: 保持原始比例
              value: original
            - label: 横版 4:3
              value: landscape
            - label: 正方形 1:1
              value: square
            - label: 竖版 3:4
              value: portrait
      - name: galleryFit
        label: 作品图片显示
        type: select
        options:
          values:
            - label: 完整显示（不裁切）
              value: contain
            - label: 填充区域（允许裁切）
              value: cover
      - name: galleryPosition
        label: 作品图片位置
        type: select
        options:
          values:
            - label: 项目说明之前
              value: before
            - label: 项目说明之后
              value: after
      - name: canvasBlocks
        label: 自由展示模块（可重复添加）
        type: block
        list:
          max: 20
          collapsible:
            collapsed: true
            summary: "{title} ({index})"
        blockKey: type
        blocks:
          - name: canvas
            label: 自由画布模块（推荐）
            fields:
              - name: placement
                label: 模块在页面中的位置
                type: select
                options:
                  values:
                    - label: 封面之后
                      value: after_cover
                    - label: 作品图片之前
                      value: before_gallery
                    - label: 作品图片之后
                      value: after_gallery
                    - label: 项目介绍之前
                      value: before_project_info
                    - label: 项目介绍之后
                      value: after_project_info
                    - label: 页面底部
                      value: bottom
              - name: title
                label: 模块标题
                type: string
              - name: background
                label: 背景颜色（HEX）
                type: string
                description: 例如 #F1E7DF
              - name: width
                label: 模块宽度
                type: select
                options:
                  values:
                    - label: 整行
                      value: full
                    - label: 半行
                      value: half
                    - label: 三分之一
                      value: third
              - name: size
                label: 模块尺寸
                type: select
                options:
                  values:
                    - label: 紧凑
                      value: compact
                    - label: 标准
                      value: standard
                    - label: 宽松
                      value: spacious
              - name: height
                label: 自定义最小高度（高级选项，可留空）
                type: number
              - name: padding
                label: 自定义内边距（高级选项，可留空）
                type: number
              - name: radius
                label: 圆角大小（像素）
                type: number
              - name: layout
                label: 图片与文字排列
                type: select
                options:
                  values:
                    - label: 图片在上，文字在下
                      value: vertical
                    - label: 图片与文字左右排列
                      value: horizontal
              - name: image
                label: 模块图片
                type: image
                options:
                  path: public/uploads/gallery
              - name: imagePosition
                label: 图片位置
                type: select
                options:
                  values:
                    - label: 左侧 / 上方
                      value: start
                    - label: 右侧 / 下方
                      value: end
              - name: body
                label: 模块说明文字
                type: text
          - name: color_panel
            label: 旧版色块画布（兼容已有内容）
            fields:
              - name: placement
                label: 模块在页面中的位置
                type: select
                options:
                  values:
                    - label: 封面之后
                      value: after_cover
                    - label: 作品图片之前
                      value: before_gallery
                    - label: 作品图片之后
                      value: after_gallery
                    - label: 项目介绍之前
                      value: before_project_info
                    - label: 项目介绍之后
                      value: after_project_info
                    - label: 页面底部
                      value: bottom
              - name: title
                label: 模块标题
                type: string
              - name: background
                label: 背景颜色（HEX）
                type: string
              - name: width
                label: 模块宽度
                type: select
                options:
                  values:
                    - label: 整行
                      value: full
                    - label: 半行
                      value: half
                    - label: 三分之一
                      value: third
              - name: size
                label: 模块尺寸
                type: select
                options:
                  values:
                    - compact
                    - standard
                    - spacious
              - name: height
                label: 自定义最小高度
                type: number
              - name: padding
                label: 自定义内边距
                type: number
              - name: radius
                label: 圆角大小
                type: number
              - name: layout
                label: 图片与文字排列
                type: select
                options:
                  values:
                    - vertical
                    - horizontal
              - name: image
                label: 色块内图片
                type: image
                options:
                  path: public/uploads/gallery
              - name: imagePosition
                label: 图片位置
                type: select
                options:
                  values:
                    - start
                    - end
              - name: body
                label: 模块说明文字
                type: text
          - name: image
            label: 旧版独立图片模块（兼容已有内容）
            fields:
              - name: placement
                label: 模块在页面中的位置
                type: select
                options:
                  values:
                    - label: 封面之后
                      value: after_cover
                    - label: 作品图片之前
                      value: before_gallery
                    - label: 作品图片之后
                      value: after_gallery
                    - label: 项目介绍之前
                      value: before_project_info
                    - label: 项目介绍之后
                      value: after_project_info
                    - label: 页面底部
                      value: bottom
              - name: image
                label: 图片
                type: image
                options:
                  path: public/uploads/gallery
              - name: width
                label: 图片宽度
                type: select
                options:
                  values:
                    - full
                    - half
                    - third
          - name: text
            label: 旧版文字模块（兼容已有内容）
            fields:
              - name: placement
                label: 模块在页面中的位置
                type: select
                options:
                  values:
                    - label: 封面之后
                      value: after_cover
                    - label: 作品图片之前
                      value: before_gallery
                    - label: 作品图片之后
                      value: after_gallery
                    - label: 项目介绍之前
                      value: before_project_info
                    - label: 项目介绍之后
                      value: after_project_info
                    - label: 页面底部
                      value: bottom
              - name: title
                label: 标题
                type: string
              - name: body
                label: 说明文字
                type: text
              - name: width
                label: 模块宽度
                type: select
                options:
                  values:
                    - full
                    - half
                    - third
      - name: videoUrl
        label: 视频链接
        type: string
      - name: videoFile
        label: 视频文件
        type: file
        options:
          categories: [video]
          path: public/uploads/videos
      - name: externalUrl
        label: 外部作品链接
        type: string
      - name: sortOrder
        label: 排序数字
        type: number
